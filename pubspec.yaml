name: paceup
description: "PaceUp - training plans, live run tracking and race history."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  meta: ^1.17.0

  # State management + DI
  flutter_riverpod: ^3.4.2

  # Navigation
  go_router: ^17.5.0
  # Persistence
  shared_preferences: ^2.5.5
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4

  # Maps + location
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  # UI utilities
  intl: ^0.20.3
  flutter_svg: ^2.3.0
  cached_network_image: ^3.4.1
  fl_chart: ^1.2.0
  wakelock_plus: ^1.7.0
  dio: ^5.11.0
  flutter_secure_storage: ^11.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  drift_dev: ^2.34.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
