name: camrun
description: "CamRun - training plans, live run tracking and race history."
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  meta: ^1.17.0

  # State management + DI
  flutter_riverpod: ^3.4.2

  # Navigation
  go_router: ^17.5.0
  # Persistence
  shared_preferences: ^2.5.5
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4

  # Maps + location
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  # Solo para POST_NOTIFICATIONS: en Android 13+ la notificacion del servicio en
  # primer plano —la que mantiene viva la grabacion con la pantalla apagada— no
  # se ve sin ese permiso, y geolocator no lo pide.
  permission_handler: ^12.0.1
  # UI utilities
  intl: ^0.20.2
  flutter_svg: ^2.3.0
  cached_network_image: ^3.4.1
  # Ya venia con cached_network_image; se declara para cachear en disco
  # las teselas del mapa y que la ruta se siga viendo sin cobertura.
  flutter_cache_manager: ^3.4.2
  # Comprobante de pago: la unica forma de coger una captura de la galeria o
  # hacer una foto. Temporal, igual que el cobro por QR manual que la usa.
  image_picker: ^1.2.0
  # El QR de cobro se dibuja en el movil desde el texto que manda la API: unos
  # bytes en vez de una imagen de cientos de KB, nitido a cualquier tamano y
  # pintado sin depender de la red. Temporal, igual que el cobro por QR manual.
  qr_flutter: ^4.1.0
  # El admin sube la foto del QR de su banca y la app le saca el texto ahi
  # mismo: zxing2 lo decodifica y image_picker/image solo le dan los pixeles.
  # Puro Dart, sin camara ni permisos. Temporal, igual que el cobro por QR.
  zxing2: ^0.2.3
  image: ^4.9.2
  fl_chart: ^1.2.0
  wakelock_plus: ^1.7.0
  dio: ^5.11.0
  # Abre la politica de privacidad y la pagina de borrado de cuenta en el
  # navegador: enlazarlas desde la app es requisito de Play Store.
  url_launcher: ^6.3.1
  flutter_secure_storage: ^11.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  # Mapa en vivo de la maraton y aviso de largada. El backend ya expone un
  # gateway Socket.IO en /live: esto es su cliente, no una capa nueva.
  socket_io_client: ^3.1.6
  # Seguimiento en vivo de la maraton oficial: servicio nativo, cola offline y
  # reintento ya resueltos. Solo se enciende durante la carrera.
  traccar_client_sdk: ^1.0.10

# traccar_client_sdk aplica kotlin-android, asi que el proyecto va con
# android.builtInKotlin=false. image_picker_android >=0.8.13+17 movio su
# Messages.kt (ImagePickerApi) a src/main/kotlin y ya solo compila con
# built-in Kotlin. +16 es la ultima 100% Java. Quitar cuando traccar migre.
dependency_overrides:
  image_picker_android: 0.8.13+16

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  # Solo para el test del lector de QR: pinta uno de verdad para decodificarlo.
  qr: ^3.0.2
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  drift_dev: ^2.34.0
  # Genera los mipmap de Android y el appiconset de iOS desde un solo PNG.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

# Ejecutar tras cambiar el logo:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icono-tienda-1024.png"
  # El ícono adaptativo de Android recorta a círculo: el logo va sobre un fondo
  # plano y con margen, si no se come los bordes.
  adaptive_icon_background: "#4C1D95"
  adaptive_icon_foreground: "assets/icons/adaptive-foreground-1024.png"
